name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - all
          - android
          - ios
          - web
        default: all
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Writes the APK to the EAS build page; download link is printed in the log.
      - name: Build Android
        run: eas build --platform android --profile production --non-interactive

  ios:
    name: iOS IPA
    # Requires Apple Developer credentials registered with EAS, plus the
    # ENABLE_IOS_BUILD repository variable set to true.
    if: >-
      (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios')
      && vars.ENABLE_IOS_BUILD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: eas build --platform ios --profile production --non-interactive

  web:
    name: Web
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build:web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDEASED }}
          projectId: mindeased
          target: app
          channelId: live
